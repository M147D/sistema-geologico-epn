# SPA estática detrás de Caddy (que pone TLS y los encabezados de seguridad).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas del cliente (react-router): todo lo que no es archivo va a index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
